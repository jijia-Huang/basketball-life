function trainingAlloc(dice,after,title="分配訓練成果（點能力套用當前骰）",resultTitle="訓練成果"){let idx=0,hist=[],touched={},beforeOVR=baseOVR();const box=$("action-content");$("actions").classList.add("alloc");$("action-title").textContent=title;function render(){box.innerHTML=`<div class="dice">${dice.map((d,i)=>`<span class="die ${i<idx?"used":""} ${i===idx?"active":""} ${d===6?"six":""}">${d}</span>`).join("")}</div>`;KEYS.forEach(k=>{const v=S.ab[k],pot=S.pot[k],c=cost(k),r=document.createElement("button");r.type="button";r.className="ability";r.innerHTML=`<b>${AB[k]}</b><span class="bar"><i style="width:${v/80*100}%"></i><em style="left:${pot/80*100}%"></em></span><span class="val">${v}<small>潛力 ${pot}${c>1?` · ${S.carry[k]}/${c}`:""}</small></span>`;r.disabled=idx>=dice.length||v>=80;if(!r.disabled)r.onclick=()=>{const amt=dice[idx],before=[k,v,S.carry[k],amt];addAbility(k,amt);hist.push(before);touched[k]=(touched[k]||0)+amt;idx++;updateBoard();render()};box.appendChild(r)});const bottom=document.createElement("div");bottom.className="alloc-bottom";const undo=document.createElement("button");undo.className="choice";undo.textContent="↩ 復原";undo.disabled=!hist.length;if(hist.length)undo.onclick=()=>{const[k,v,carry,amt]=hist.pop();S.ab[k]=v;S.carry[k]=carry;touched[k]-=amt;if(!touched[k])delete touched[k];idx--;updateBoard();render()};bottom.appendChild(undo);if(idx>=dice.length||KEYS.every(k=>S.ab[k]>=80)){const ok=document.createElement("button");ok.className="choice main";ok.textContent="確認 ▸";ok.onclick=()=>{if(S.age>=26&&!S.traits.includes("天才")&&!S.traits.includes("大器晚成")&&baseOVR()-beforeOVR>=5){S.traits.push("大器晚成");card("隱藏特質：大器晚成","單季 BaseOVR 成長 5；今後訓練骰固定為 3～6。","gold")}const summary=Object.entries(touched).map(([k,v])=>`${AB[k]} ${v} 點`).join("、")||"未提升能力";card(resultTitle,summary+"。");clearActions();after()};bottom.appendChild(ok)}box.appendChild(bottom)}render();if(!matchMedia("(prefers-reduced-motion: reduce)").matches)box.querySelectorAll(".die").forEach((el,i)= function redZone(){actions("身體進入紅區",[{t:"輪休",s:"負荷 −20，本季出賽受限",f:()=>{S.load-=20;S.seasonForm--;card("負荷管理","你接受輪休，先保住生涯長度。");bodyChoice()}},{t:"帶傷硬打",s:"保留角色，重大傷病率提高",f:()=>{S.load=clamp(S.load+8,0,100);S.seasonForm++;card("帶傷上陣","你選擇不退，風險也跟著上升。","bad");bodyChoice()}},{t:"完整復健",s:"本季不出賽，負荷降至 20",f:()=>{S.load=20;card("完整復健","整季沒有數據，但身體終於得到休息。","good");S.career.push({year:S.year,age:S.age,league:S.league,team:S.team,role:"復健",gp:0,gs:0,min:0,mpg:0,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,TS:0,bvi:0});nextYearAction()}}])}
function careerScore(){let score=0;for(const y of S.career){score+=Math.max(0,(y.bvi||0)-12)*(y.gp||0)*(LEAGUES[y.league]?.str||.2)/6}for(const h of S.honors){if(h.includes("年度 MVP"))score+=500;else if(h.includes("防守"))score+=400;else if(h.includes("總冠軍"))score+=120;else if(h.includes("王"))score+=150;else if(h.includes("明星"))score+=60}return Math.round(score)}
function retire(reason){S.done=true;clearActions();const score=careerScore(),tier=score>=5000?"全球籃球名人堂":score>=3500?"傳奇球星":score>=2300?"明星球員":score>=1200?"可靠輪替":score>=500?"邊緣球員":"一頁過客";card("生涯終幕",`${reason}<p>生涯評價：<b>${score}</b> · <span class="tag">${tier}</span></p>`,score>=5000?"gold":"");let rows=S.career.map(y=>`<tr><td>${y.year}</td><td>${y.team}</td><td>${y.role}</td><td>${y.gp||0}</td><td>${y.gp?(y.pts/y.gp).toFixed(1):"-"}</td><td>${y.gp?(y.reb/y.gp).toFixed(1):"-"}</td><td>${y.gp?(y.ast/y.gp).toFixed(1):"-"}</td></tr>`).join("");card("生涯年表",`<div style="overflow:auto"><table><tr><th>年</th><th>球隊</th><th>角色</th><th>GP</th><th>PTS</th><th>REB</th><th>AST</th></tr>${rows}</table></div><p>總薪資：<b>${money(S.salary)}</b> 新台幣</p><p>${S.traits.map(x=>`<span class="tag">${x}</span>`).join("")||"沒有隱藏特質"}</p><p>${S.honors.map(x=>`<span class="tag">${x}</span>`).join("")||"沒有主要獎項"}</p>`);actions("生涯完成",[{t:"複製生涯摘要",f:()=>navigator.clipboard?.writeText(`${S.name}｜${tier}｜評價 ${score}｜生涯薪 ${money(S.salary)}`)},{t:"用相同種子重玩",f:()=>location.reload()},{t:"換種子重新開始",f:()=>{location.href=location.pathname}}])}
function startGame(){SEED=$("seed-input").value.trim()||SEED;history.replaceState(null,"","?seed="+encodeURIComponent(SEED));seedInit(SEED+":"+selectedOrigin);S=newPlayer($("player-name").value.trim()||"林宇翔",selectedOrigin);$("start").classList.add("hidden");$("game").classList.remove("hidden");$("menu-seed").textContent=`${VERSION} · SEED ${SEED}`;$("tl-seed").textContent=SEED;$("tl-version").textContent=VERSION;card("球員誕生",`${S.nation}球員 <b>${S.name}</b> 加入 ${S.team}。<p><span class="tag">${S.height} cm</span><span class="tag">${S.weight} kg</span><span class="tag">${positionData().main}</span></p><p class="muted">位置不是永久標籤；身材與能力每年都會重新評估。</p>`,"gold");updateBoard();startYear()}
function assert(ok,msg){if(!ok)throw Error(msg)}
function selftest(){const saved=[SEED,_rng,S],mk=()=>{seedInit("selftest:TW");return newPlayer("測試", "TW")};let a=mk(),b=mk();assert(JSON.stringify(a)===JSON.stringify(b),"seed determinism");a.height=229;a.age=17;S=a;seedInit("growth");growth();assert(a.height<=230,"height cap");a.height=190;a.weight=86;a.ab={STA:45,ATH:47,FIN:43,MID:42,THREE:51,HANDLE:44,PASS:40,REB:40,PERD:48,INTD:34};a.pot={...a.ab};a.off="shoot";a.def="point";a.league="NBA";a.seasonForm=-1;a.load=0;assert(positionData(a).main==="SG","position case");assert(baseOVR(a)===48,"ovr case");let st=simulateStats(a,{gpRate:.48,mpg:7,gsRate:.01,luck:0});assert(st.gp===39&&st.mpg===7,"fringe minutes");assert(st.gp<=82&&st.gs<=st.gp&&st.fgm<=st.fga&&st.tpm<=st.tpa&&st.ftm<=st.fta,"stat invariants");assert(Math.abs(trainingExpectation()-13.825)<1e-9&&Math.abs(trainingExpectation(["大器晚成"])-17.775)<1e-9&&Math.abs(trainingExpectation(["天才"])-19.75)<1e-9,"trait dice expectations");a.traits=["天才"];seedInit("genius dice");assert(trainingDice().every(x=>x>=4),"genius dice floor");a.traits=["大器晚成"];seedInit("late dice");assert(trainingDice().every(x=>x>=3),"late dice floor");a.traits=[];seedInit("count dice");const normal=trainingDice().length;a.traits=["外務纏身"];seedInit("count dice");assert(trainingDice().length===Math.max(2,normal-1),"outside-work die penalty");assert(draftResult(70,64.999)==="lottery"&&draftResult(70,65)==="first"&&draftResult(70,95)==="second"&&draftResult(65,95)==="none"&&draftResult(55,50)==="none"&&draftResult(54.99,.999)==="second"&&draftResult(54.99,1)==="none","draft boundaries");assert(nbaInterest(58,()=>false)&&!nbaInterest(57.99,()=>false)&&nbaInterest(52,()=>true)&&!nbaInterest(51.99,()=>false)&&nbaInterest(46,()=>true)&&!nbaInterest(45.99,()=>false),"retention boundaries");a.traits=[];a.ab=Object.fromEntries(KEYS.map(k=>[k,80]));a.pot={...a.ab};a.off="shoot";a.def="point";a.seasonForm=0;a.load=0;a.age=28;a.faHome={league:"NBA",team:"測試隊"};assert(freeAgentLeagues(()=>false).includes("NBA"),"NBA retention");assert(freeAgencyStep(1,[])==="retry"&&freeAgencyStep(2,[])==="fallback","two-round FA");const fb=fallbackContract(a.faHome);assert(fb.years===1&&fb.mult===.7&&fb.team==="測試隊","FA fallback");[SEED,_rng,S]=saved;console.log("Basketball Life selftest: PASS");return true}
function selftestPaths(){const saved=[_rng,S];seedInit("selftest paths");S=newPlayer("流程測試","TW");S.age=18;S.year=2028;graduateTo(()=>enterCollege(()=>{}));assert(S.age===19&&S.year===2029&&S.college&&S.stage==="AM"&&S.league==="AM"&&COLLEGES.TW.includes(S.team),"college graduation route");S.age=22;assert(canChooseDraft(),"22-year-old optional draft");S.declared=true;assert(!canChooseDraft(),"declared draft guard");S.league="TW";S.stage="PRO";S.age=28;S.injuries=0;S.salaryMult=.7;assert(seasonSalary("輪替")===Math.round(salaryFor("輪替")*.7),"fallback salary");for(const[bvi,points]of[[11.99,3],[12,4],[16,5],[20,6],[24,7],[28,8],[32,9],[36,10]])assert(amateurGrowth({bvi})===points,"amateur growth "+bvi);for(const[wp,points]of[[.34,3],[.35,4],[.45,5],[.50,6],[.55,7],[.60,8],[.65,9],[.75,10]])assert(teamGrowth({wp})===points,"team growth "+wp);S.pot.STA=80;for(const[v,c]of[[20,1],[50,1],[60,2],[70,3],[75,5]]){S.ab.STA=v;assert(cost("STA")===c,"training cost "+v)}S.pot.STA=50;S.ab.STA=50;assert(cost("STA")===3,"potential cost multiplier");S.contract=0;assert(acceptContract("TW","第一隊",1)&&!acceptContract("JP1","第二隊",2)&&!sign("JP1",2,()=>{})&&S.team==="第一隊"&&S.league==="TW"&&S.contract===1,"single contract");[_rng,S]=saved}
function selftestEventChance(){const old=S;S={traits:[],stage:"AM",age:22,college:true,declared:false};assert(eventChance(70)===70,"normal event chance");S.traits=["天才"];assert(eventChance(70)===80&&eventChance(95)===100,"genius event chance");assert(eventCount()===2&&canChooseDraft(),"amateur event count and optional draft");S.stage="PRO";S.college=false;assert(eventCount()===3,"pro event count");S=old}
let selectedOrigin="TW",selectedTheme=localStorage.getItem("basketball-theme")||"a";
$("start-version").textContent=VERSION;
document.body.dataset.theme=selectedTheme;$("seed-input").value=SEED;document.querySelectorAll("#theme button").forEach(x=>x.classList.toggle("on",x.dataset.v===selectedTheme));$("origin").onclick=e=>{const b=e.target.closest("button");if(!b)return;selectedOrigin=b.dataset.v;document.querySelectorAll("#origin button").forEach(x=>x.classList.toggle("on",x===b))};$("theme").onclick=e=>{const b=e.target.closest("button");if(!b)return;selectedTheme=b.dataset.v;document.body.dataset.theme=selectedTheme;localStorage.setItem("basketball-theme",selectedTheme);document.querySelectorAll("#theme button").forEach(x=>x.classList.toggle("on",x===b))};$("new-seed").onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);$("seed-input").value=SEED};$("start-btn").onclick=startGame;$("action-toggle").onclick=()=>{const c=$("actions").classList.toggle("actions-collapsed");$("action-toggle").textContent=c?"⌃ 展開選項":"⌄ 收合選項"};$("menu-btn").onclick=()=>$("menu").classList.remove("hidden");$("menu-close").onclick=()=>$("menu").classList.add("hidden");$("restart").onclick=()=>location.href=location.pathname;$("copy-seed").onclick=async()=>{await navigator.clipboard?.writeText(location.href);$("copy-seed").textContent="已複製"};
if(new URLSearchParams(location.search).has("selftest")){try{selftest();selftestPaths();selftestEventChance();document.body.innerHTML='<main class="start"><div class="startbox"><h1>Selftest PASS</h1><p>Basketball Life 核心公式檢查通過。</p></div></main>'}catch(e){document.body.innerHTML=`<pre style="padding:20px;color:#ef6f6c">Selftest FAIL\n${e.stack}</pre>`;throw e}}
