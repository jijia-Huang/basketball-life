function salaryFor(role){const mult={DNP:1,"板凳邊緣":1.05,"一般板凳":1.25,"輪替":1.8,"先發":3.5,"球隊核心":12,"超級球星":45}[role]||1;return Math.round(LEAGUES[S.league].base*mult*(S.age<=29?1:clamp(1-(S.age-29)*.06,.55,1))*clamp(1-S.injuries*.08,.6,1))}
function amateurEnd(){if(S.age<18)return nextYearAction();card("生涯岔路",`你已完成 ${ORIGINS[S.origin].route} 的主要階段。下一年可以挑戰選秀、加入職業，或再磨一年。`,"gold");nextYearAction()}
function nextYearAction(){actions("年度結束",[{t:"進入下一年",s:`${S.year+1} 年 · ${S.age+1} 歲`,f:()=>{S.age++;S.year++;startYear()}},...(S.stage==="PRO"&&S.age>=35?[{t:"宣布退休",s:"結束球員生涯",f:()=>retire("你決定不再追逐下一張合約。") }]:[])])}
function careerChoice(){const opts=[];if(!S.declared)opts.push({t:"申報美職籃選秀",s:"一生只有一次；可能首輪、次輪或落選",f:runDraft});opts.push({t:"加入本地職業聯盟",s:"先累積比賽經驗，未來仍可旅外",f:()=>sign(localLeague(),3)});if(S.age<22)opts.push({t:"再磨練一年",s:"保留選秀資格，繼續業餘／大學／青年隊",f:bodyChoice});else if(!S.declared)opts[0].s="22 歲最後選秀資格年";actions("選擇下一步",opts)}
function localLeague(){return{TW:"TW",US:"GL",JP:"JP1",EU:"EUD"}[S.origin]}
function potentialOVR(){const old=S.ab;S.ab=S.pot;const v=baseOVR();S.ab=old;return v}
function runDraft(){S.declared=S.drafted=true;const fake={...S,league:"AM"},st=simulateStats(fake,{gpRate:.9,mpg:32,gsRate:.9,luck:0}),prod=clamp(50+(st.bvi-27)*1.2,20,80),age={19:4,20:2,21:0,22:-3}[S.age]??-3,score=.45*impact()+.25*potentialOVR()+.20*prod+age+ri(-4,4)-S.injuries*2;let result;if(score>=75)result="lottery";else{let r=R()*100;if(score>=70)result=r<65?"lottery":r<95?"first":"second";else if(score>=65)result=r<15?"lottery":r<75?"first":r<95?"second":"none";else if(score>=60)result=r<30?"first":r<85?"second":"none";else if(score>=55)result=r<5?"first":r<50?"second":"none";else result=r<1?"second":"none"}if(result!=="none"){let num=result==="lottery"?clamp(Math.round(14-(score-75))+ri(-2,2),1,14):result==="first"?clamp(Math.round(30-(score-60)*1.5)+ri(-2,2),15,30):clamp(Math.round(60-(score-55)*2)+ri(-2,2),31,60);const tm=pick(TEAMS.NBA);card("美職籃選秀",`球探評分 ${score.toFixed(1)}。第 <b>${num}</b> 順位，${tm} 選中了你！`,"gold");S.team=tm;S.league="NBA";S.stage="PRO";S.contract=result==="second"?2:4;bodyChoice()}else{card("選秀落選",`球探評分 ${score.toFixed(1)}。六十個名字唸完，沒有你的名字。這不是生涯終點。`,"bad");actions("落選後選擇",[{t:"加入 G League",f:()=>sign("GL",2)},{t:"轉戰本地職籃",f:()=>sign(localLeague(),2)},{t:"前往歐洲",f:()=>sign("EUD",2)}])}}
function sign(lg,years){S.league=lg;S.stage="PRO";S.team=pick(TEAMS[lg]);S.contract=years;card("簽下職業合約",`加盟 <b>${S.team}</b>，合約 ${years} 年。`,"good");updateBoard();bodyChoice()}
function freeAgency(){const imp=impact(),offers=[],all=["NBA","EUT","JP1","EUD","GL","TW","JP2"];for(const lg of all){let eligible=lg==="NBA"?(S.league==="NBA"||imp>=58&&S.age<=31):imp>=LEAGUES[lg].L-8;if(eligible&&chance(lg===S.league?80:45))offers.push(lg)}const unique=[...new Set(offers)].slice(0,4).map(lg=>({lg,team:pick(TEAMS[lg])}));if(!unique.length){card("自由市場",`沒有球隊提出正式合約。`,"bad");return retire("兩輪自由市場都沒有報價，球員生涯在沉默中結束。") }actions("全球自由市場",unique.map(({lg,team})=>{let role=roleFor(impact()-LEAGUES[lg].L)[0],yrs=role==="DNP"||role==="板凳邊緣"?1:role==="超級球星"?ri(3,5):ri(1,3),pay=salaryForOffer(lg,role);return{t:`${team} · ${LEAGUES[lg].n}`,s:`預估 ${role}｜${yrs} 年｜年薪約 ${money(pay)}`,f:()=>{S.league=lg;S.team=team;S.contract=yrs;card("簽約",`加入 ${S.team}，${yrs} 年合約。`,"good");nextYearAction()}}}))}
function salaryForOffer(lg,role){const old=S.league;S.league=lg;const n=salaryFor(role);S.league=old;return n}
function redZone(){actions("身體進入紅區",[{t:"輪休",s:"負荷 −20，本季出賽受限",f:()=>{S.load-=20;S.seasonForm--;card("負荷管理","你接受輪休，先保住生涯長度。");bodyChoice()}},{t:"帶傷硬打",s:"保留角色，重大傷病率提高",f:()=>{S.load=clamp(S.load+8,0,100);S.seasonForm++;card("帶傷上陣","你選擇不退，風險也跟著上升。","bad");bodyChoice()}},{t:"完整復健",s:"本季不出賽，負荷降至 20",f:()=>{S.load=20;card("完整復健","整季沒有數據，但身體終於得到休息。","good");S.career.push({year:S.year,age:S.age,league:S.league,team:S.team,role:"復健",gp:0,gs:0,min:0,mpg:0,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,TS:0,bvi:0});nextYearAction()}}])}
function careerScore(){let score=0;for(const y of S.career){score+=Math.max(0,(y.bvi||0)-12)*(y.gp||0)*(LEAGUES[y.league]?.str||.2)/6}for(const h of S.honors){if(h.includes("年度 MVP"))score+=500;else if(h.includes("防守"))score+=400;else if(h.includes("總冠軍"))score+=120;else if(h.includes("王"))score+=150;else if(h.includes("明星"))score+=60}return Math.round(score)}
function retire(reason){S.done=true;clearActions();const score=careerScore(),tier=score>=5000?"全球籃球名人堂":score>=3500?"傳奇球星":score>=2300?"明星球員":score>=1200?"可靠輪替":score>=500?"邊緣球員":"一頁過客";card("生涯終幕",`${reason}<p>生涯評價：<b>${score}</b> · <span class="tag">${tier}</span></p>`,score>=5000?"gold":"");let rows=S.career.map(y=>`<tr><td>${y.year}</td><td>${y.team}</td><td>${y.role}</td><td>${y.gp||0}</td><td>${y.gp?(y.pts/y.gp).toFixed(1):"-"}</td><td>${y.gp?(y.reb/y.gp).toFixed(1):"-"}</td><td>${y.gp?(y.ast/y.gp).toFixed(1):"-"}</td></tr>`).join("");card("生涯年表",`<div style="overflow:auto"><table><tr><th>年</th><th>球隊</th><th>角色</th><th>GP</th><th>PTS</th><th>REB</th><th>AST</th></tr>${rows}</table></div><p>總薪資：<b>${money(S.salary)}</b> 新台幣</p><p>${S.honors.map(x=>`<span class="tag">${x}</span>`).join("")||"沒有主要獎項"}</p>`);actions("生涯完成",[{t:"複製生涯摘要",f:()=>navigator.clipboard?.writeText(`${S.name}｜${tier}｜評價 ${score}｜生涯薪 ${money(S.salary)}`)},{t:"用相同種子重玩",f:()=>location.reload()},{t:"換種子重新開始",f:()=>{location.href=location.pathname}}])}
function startGame(){SEED=$("seed-input").value.trim()||SEED;history.replaceState(null,"","?seed="+encodeURIComponent(SEED));seedInit(SEED+":"+selectedOrigin);S=newPlayer($("player-name").value.trim()||"林宇翔",selectedOrigin);$("start").classList.add("hidden");$("game").classList.remove("hidden");$("menu-seed").textContent=`${VERSION} · SEED ${SEED}`;card("球員誕生",`${S.nation}球員 <b>${S.name}</b> 加入 ${S.team}。<p><span class="tag">${S.height} cm</span><span class="tag">${S.weight} kg</span><span class="tag">${positionData().main}</span></p><p class="muted">位置不是永久標籤；身材與能力每年都會重新評估。</p>`,"gold");updateBoard();startYear()}
function assert(ok,msg){if(!ok)throw Error(msg)}
function selftest(){const saved=[SEED,_rng,S],mk=()=>{seedInit("selftest:TW");return newPlayer("測試", "TW")};let a=mk(),b=mk();assert(JSON.stringify(a)===JSON.stringify(b),"seed determinism");a.height=229;a.age=17;S=a;seedInit("growth");growth();assert(a.height<=230,"height cap");a.height=190;a.weight=86;a.ab={STA:45,ATH:47,FIN:43,MID:42,THREE:51,HANDLE:44,PASS:40,REB:40,PERD:48,INTD:34};a.pot={...a.ab};a.off="shoot";a.def="point";a.league="NBA";a.seasonForm=-1;a.load=0;assert(positionData(a).main==="SG","position case");assert(baseOVR(a)===48,"ovr case");let st=simulateStats(a,{gpRate:.48,mpg:7,gsRate:.01,luck:0});assert(st.gp===39&&st.mpg===7,"fringe minutes");assert(st.gp<=82&&st.gs<=st.gp&&st.fgm<=st.fga&&st.tpm<=st.tpa&&st.ftm<=st.fta,"stat invariants");[SEED,_rng,S]=saved;console.log("Basketball Life selftest: PASS");return true}
let selectedOrigin="TW";
$("seed-input").value=SEED;$("origin").onclick=e=>{const b=e.target.closest("button");if(!b)return;selectedOrigin=b.dataset.v;document.querySelectorAll("#origin button").forEach(x=>x.classList.toggle("on",x===b))};$("new-seed").onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);$("seed-input").value=SEED};$("start-btn").onclick=startGame;$("menu-btn").onclick=()=>$("menu").classList.remove("hidden");$("menu-close").onclick=()=>$("menu").classList.add("hidden");$("restart").onclick=()=>location.href=location.pathname;$("copy-seed").onclick=async()=>{await navigator.clipboard?.writeText(location.href);$("copy-seed").textContent="已複製"};
if(new URLSearchParams(location.search).has("selftest")){try{selftest();document.body.innerHTML='<main class="start"><div class="startbox"><h1>Selftest PASS</h1><p>Basketball Life 核心公式檢查通過。</p></div></main>'}catch(e){document.body.innerHTML=`<pre style="padding:20px;color:#ef6f6c">Selftest FAIL\n${e.stack}</pre>`;throw e}}
